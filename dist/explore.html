<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#142b25"><meta name="description" content="Explore the Climate City concept: a connected landscape of culture, learning, wellbeing and opportunity in Nasarawa, Nigeria."><title>Explore City — Climate City</title><link rel="stylesheet" href="vendor/pannellum.css"><link rel="stylesheet" href="styles.css"><link rel="icon" type="image/png" href="assets/logo-green-compact.png"></head>
<body>
<script>if(new URLSearchParams(location.search).has("embedded"))document.documentElement.classList.add("embedded");</script>
<div id="world" tabindex="0" role="region" aria-label="Interactive conceptual masterplan. Use arrow keys to rotate or pan, plus and minus to zoom, Space to pause orbit, and Home to reset."><canvas id="map" aria-label="Three dimensional Climate City masterplan. Use destination buttons to explore."></canvas><div id="aerial" hidden></div><div id="markers" aria-label="Masterplan locations"></div></div>
<div class="world-vignette"></div>
<header class="topbar"><a href="#" class="brand" aria-label="Explore City overview"><img class="brand-mark" src="assets/logo-green.png" alt="" width="44" height="44"><span>Climate City</span></a><button id="destinationsToggle" class="icon-button" aria-label="Locations" aria-expanded="false" aria-controls="destinationsMenu">☰</button><button id="closeExplore" class="close-explore" aria-label="Close aerial view and return to website">× <span>Close</span></button></header>
<main id="overview"><div class="world-controls"><div class="view-switch" hidden role="group" aria-label="Masterplan view"><button id="view3d" class="active" aria-pressed="true">3D model</button><button id="viewAerial" aria-pressed="false" hidden>Aerial 360°</button></div><button id="rotate" class="icon-button" aria-label="Pause orbit" title="Pause orbit">Pause</button><button id="zoomOut" class="icon-button" aria-label="Zoom out">−</button><button id="zoomIn" class="icon-button" aria-label="Zoom in">+</button><button id="resetView" class="icon-button" aria-label="Reset view" title="Reset view">↺</button></div></main>
<aside id="destinationsMenu" class="destination-menu" role="dialog" aria-modal="true" aria-label="Choose a destination" hidden><div class="menu-top"><div><span class="eyebrow">CLIMATE CITY</span><h2>Locations</h2></div><button class="icon-button" id="closeMenu" aria-label="Close destinations">×</button></div><div id="destinationList"></div><p class="menu-note">Proposed experiences and illustrative locations. Final layouts are subject to site studies and approvals.</p></aside>
<section id="journey" aria-label="Destination journey" hidden><div class="journey-sticky"><div class="journey-images"><img id="journeyImageA" alt=""><img id="journeyImageB" alt=""></div><div class="journey-shade"></div><button class="back-button" id="backToCity"><span>City</span></button><div class="journey-top-right"><span id="destinationName"></span><button class="icon-button" id="journeyMenu" aria-label="Choose another destination">☰</button></div><article class="journey-copy"><div class="eyebrow" id="journeyEyebrow"></div><h2 id="journeyTitle"></h2><p id="journeyDescription"></p><div class="journey-counter"><span id="imageCount">01 / 06</span><span class="counter-line"></span><span id="journeyCategory">SPACES TO EXPLORE</span></div></article><div class="journey-bottom"><div class="journey-dots" id="journeyDots" aria-label="Choose a view"></div><div class="journey-arrows"><button id="previousImage" aria-label="Previous view">←</button><button id="nextImage" aria-label="Next view">→</button></div></div><div class="scroll-hint" id="scrollHint">Scroll to explore</div><div class="journey-progress"><span id="journeyProgress"></span></div><div class="visualisation-note">Concept visualisation · Animated image journey</div></div><div id="journeyScrollSpace"></div></section>
<div id="loadingCurtain" aria-hidden="true"><span>Entering <em id="enterName">Climate City</em></span></div><div id="announcer" class="sr-only" aria-live="polite"></div><script src="vendor/pannellum.js"></script><script src="app.js"></script>
</body></html>
